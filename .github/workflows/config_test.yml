name: configuration regression tests
on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  config:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: v0.12.6
      - name: Test configuration without downloading plugins
        run: nvim --headless -u NONE -i NONE -l tests/config.lua
